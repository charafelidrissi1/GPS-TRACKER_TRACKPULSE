[package]
name = "gps-tracker"
version = "0.2.0"
edition = "2021"

[dependencies]
# Async runtime for the TCP tracker server
tokio = { version = "1", features = ["full"] }
# HTTP API + WebSockets
axum = { version = "0.8", features = ["ws"] }
# CORS for browser access
tower-http = { version = "0.6", features = ["cors"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Embedded SQLite (file-based, zero config)
rusqlite = { version = "0.33", features = ["bundled"] }
# Bytes buffer utilities
bytes = "1"
# Date/time handling
chrono = { version = "0.4", features = ["serde"] }
# Unique IDs
uuid = { version = "1", features = ["v4"] }
# Future/stream utilities for WebSocket
futures-util = "0.3"

[dev-dependencies]

[[bin]]
name = "gps-tracker"
path = "src/main.rs"
